# Builds native installers on each OS (Compose/jpackage cannot cross-compile).
# Run manually from the Actions tab for a beta, or push a `v*` tag to also
# publish the installers on a GitHub release.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: grimoire-windows-msi
            path: build/compose/binaries/main/msi/*.msi
          - os: macos-latest
            artifact: grimoire-macos-dmg
            path: build/compose/binaries/main/dmg/*.dmg
          - os: ubuntu-latest
            artifact: grimoire-linux-deb
            path: build/compose/binaries/main/deb/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run tests (Linux only — one honest gate, not three slow ones)
        if: runner.os == 'Linux'
        run: ./gradlew desktopTest
        shell: bash
      - name: Package
        run: ./gradlew packageDistributionForCurrentOS
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
