# Builds native installers on each OS (Compose/jpackage cannot cross-compile).
# Run manually from the Actions tab for a beta, or push a `v*` tag to also
# publish the installers on a GitHub release.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: grimoire-windows-msi
            path: build/compose/binaries/main/msi/*.msi
          - os: macos-latest
            artifact: grimoire-macos-dmg
            path: build/compose/binaries/main/dmg/*.dmg
          - os: ubuntu-latest
            artifact: grimoire-linux
            path: |
              build/compose/binaries/main/deb/*.deb
              build/compose/binaries/main/rpm/*.rpm
              build/compose/binaries/main/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run tests (Linux only — one honest gate, not three slow ones)
        if: runner.os == 'Linux'
        run: ./gradlew desktopTest
        shell: bash
      - name: Install rpm tooling (Linux builds Deb + Rpm)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q rpm
        shell: bash
      - name: Package
        run: ./gradlew packageDistributionForCurrentOS
        shell: bash
      - name: Build AppImage (runs on every distro — cyberdecks welcome)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./gradlew createDistributable
          APPDIR=build/AppDir
          mkdir -p "$APPDIR"
          cp -r build/compose/binaries/main/app/grimoire/* "$APPDIR/"
          cp packaging/grimoire-icon.png "$APPDIR/grimoire.png"
          cat > "$APPDIR/grimoire.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=Grimoire
          Exec=grimoire
          Icon=grimoire
          Type=Application
          Categories=Office;
          Comment=Local-first worldbuilding and writing
          DESKTOP
          ln -s bin/grimoire "$APPDIR/AppRun"
          curl -sLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run "$APPDIR" "build/compose/binaries/main/grimoire-$(cat VERSION)-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # ** because the Linux artifact keeps its deb/ and rpm/ subfolders — a flat * silently
          # dropped both from every release.
          files: dist/**
